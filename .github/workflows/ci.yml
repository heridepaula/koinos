name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 24: runtime das Functions da Vercel. 26: versão de desenvolvimento (.nvmrc).
        node: [24, 26]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Valores fictícios: o build não acessa banco nem serviços externos.
      MONGODB_URI: mongodb://127.0.0.1:27017/koinos_ci
      REDIS_URL: redis://127.0.0.1:6379
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci
      GOOGLE_CLIENT_SECRET: ci
      ALLOWED_EMAILS: ci@example.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Audit das dependências de produção
        run: npm audit --omit=dev --audit-level=high
